services:
  chat-skills:
    image: twwch/next-chat-skills:latest
    container_name: chat-skills
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - STORAGE_TYPE=${STORAGE_TYPE:-sqlite}
      - SQLITE_PATH=/app/data/chat-skills.db
      - SKILLS_DIR=/home/nextjs/.claude/skills
    volumes:
      - chat-skills-data:/app/data
      - ${SKILLS_DIR:-~/.claude/skills}:/home/nextjs/.claude/skills:ro

volumes:
  chat-skills-data:
